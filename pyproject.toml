[project]
name = "pdf-cmap-fixer"
version = "0.1.0"
description = "Repair broken ToUnicode CMaps in PDFs so extracted text matches the visual content."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.62.1",
    "pikepdf>=10.5.1",
    "pillow>=10.4.0",
    "pymupdf>=1.27.2",
]

[project.scripts]
pdf-cmap-inspect = "inspect_fonts:main"
pdf-cmap-extract = "extract_fonts:main"
pdf-cmap-render-pua = "render_pua_glyphs:main"
pdf-cmap-fix = "fix_pdf_fonts:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "_pdf_utils",
    "extract_fonts",
    "fix_pdf_fonts",
    "inspect_fonts",
    "render_pua_glyphs",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
